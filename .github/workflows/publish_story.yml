name: Publish Instagram Story

on:
  schedule:
    - cron: "30 13 * * 6"
    - cron: "30 21 * * 0"
  workflow_dispatch:
    inputs:
      story_id:
        description: "ID opcional do story"
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish-story:
    runs-on: ubuntu-latest
    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/output
      PUBLISH_START_DATE: ${{ vars.PUBLISH_START_DATE }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Publish next pending story
        run: |
          if [ -n "${{ inputs.story_id }}" ]; then
            python publish_story.py --id "${{ inputs.story_id }}"
          else
            python publish_story.py
          fi

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/stories_published.json
          git diff --cached --quiet || git commit -m "chore: update stories state"
          git push
